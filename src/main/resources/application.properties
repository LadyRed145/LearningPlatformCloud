# =====================================================
# APPLICATION
# =====================================================
spring.application.name=learningplatformcloud
server.port=8081

# =====================================================
# ORACLE CLOUD DATABASE (WALLET)
# =====================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# =====================================================
# JPA / HIBERNATE
# =====================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect

# =====================================================
# AWS S3
# =====================================================
aws.region=${AWS_REGION:us-east-1}
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME:learningplatformcloud-grupo13}

# =====================================================
# AZURE AD B2C
# =====================================================

spring.security.oauth2.resourceserver.jwt.issuer-uri=${AZURE_B2C_ISSUER_URI}

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${AZURE_B2C_JWK_SET_URI}

azure.b2c.client-id=${AZURE_B2C_CLIENT_ID:207fc1ef-3016-4acf-a5a7-1f43e0ff15cc}

# =====================================================
# ACTUATOR
# =====================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# =====================================================
# ERROR HANDLING
# =====================================================
server.error.include-message=always
server.error.include-binding-errors=always

# =====================================================
# RABBITMQ
# =====================================================
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:admin}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:Admin12345}

app.rabbitmq.queue=${RABBITMQ_QUEUE:learning.resumenes.queue}
app.rabbitmq.exchange=${RABBITMQ_EXCHANGE:learning.resumenes.exchange}
app.rabbitmq.routing-key=${RABBITMQ_ROUTING_KEY:learning.resumenes.routing}